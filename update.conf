# vCenter Certificate Updater Configuration
# This file contains sensitive credentials - protect with appropriate file permissions
# chmod 600 update.conf

# Certificate name from acme.sh (domain name registered with acme.sh)
# Example: my.vcenter.domain
CERTNAME='my.certificate.name'

# vCenter Administrator account
# Typically: administrator@vsphere.local or similar
ADMINACCOUNT='admin@vcenter.local'

# vCenter Administrator password
# IMPORTANT: Use a strong password and ensure file permissions are 600
ADMINPASS='admin'
